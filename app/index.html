<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LarpOS</title>
  <style>
    :root {
      --bg: #09131b;
      --surface: #0f2537;
      --accent: #4ecdc4;
      --fg: #cbe3db;
      --dim: #e07a5f;
      --font-mono: ui-monospace, "DejaVu Sans Mono", "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 15px;
      line-height: 1.5;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background: radial-gradient(ellipse at center, var(--surface) 0%, var(--bg) 100%);
      transition: background 0.6s ease, color 0.4s ease;
    }

    header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
      letter-spacing: 0.05em;
    }

    .header-title {
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      font-size: 14px;
    }

    .header-keeper {
      font-size: 12px;
      color: var(--fg);
      opacity: 0.8;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--bg);
    }

    .scene-box {
      border-left: 3px solid var(--accent);
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 0 4px 4px 0;
      margin-bottom: 6px;
    }

    .scene-theme {
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 8px;
      font-style: italic;
    }

    .scene-line {
      margin: 4px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-entry {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }

    .log-command {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-weight: 600;
    }

    .log-command::before {
      content: "›";
      color: var(--dim);
      font-size: 18px;
      line-height: 1;
    }

    .log-response {
      padding-left: 18px;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--fg);
      line-height: 1.6;
    }

    .command-bar {
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.5);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .prompt-label {
      color: var(--accent);
      font-weight: 700;
      user-select: none;
      white-space: nowrap;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 15px;
      caret-color: var(--accent);
    }

    #cmd-input::placeholder {
      color: var(--fg);
      opacity: 0.35;
    }

    footer {
      padding: 6px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      color: var(--dim);
      background: rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }

    .footer-left {
      display: flex;
      gap: 16px;
    }

    .action-badge {
      cursor: pointer;
      text-decoration: underline;
      opacity: 0.8;
    }
    .action-badge:hover {
      opacity: 1;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div id="world-name" class="header-title">INITIALIZING TELEMETRY...</div>
      <div id="world-keeper" class="header-keeper"></div>
    </header>

    <main id="terminal">
      <div id="scene-container" class="scene-box">
        <div id="scene-theme" class="scene-theme">Connecting to station...</div>
        <div id="scene-content"></div>
      </div>
      <div id="log-entries"></div>
    </main>

    <div class="command-bar">
      <span id="prompt-label" class="prompt-label">›</span>
      <input
        type="text"
        id="cmd-input"
        placeholder="type command (e.g. 'help', 'look', or world verb)..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
    </div>

    <footer>
      <div class="footer-left">
        <span id="footer-world">LARPOS</span>
        <span id="footer-seed">SEED: 0x00000000</span>
      </div>
      <div class="footer-right">
        <span class="action-badge" onclick="submitCommand('help')">VERBS</span>
        &nbsp;|&nbsp;
        <span class="action-badge" onclick="submitCommand('laws')">LAWS</span>
        &nbsp;|&nbsp;
        <span class="action-badge" onclick="submitCommand('new world')">NEW BOOT</span>
      </div>
    </footer>
  </div>

  <script>
    let currentWorld = null;
    const history = [];
    let historyIndex = -1;

    const dom = {
      name: document.getElementById('world-name'),
      keeper: document.getElementById('world-keeper'),
      theme: document.getElementById('scene-theme'),
      scene: document.getElementById('scene-content'),
      entries: document.getElementById('log-entries'),
      input: document.getElementById('cmd-input'),
      prompt: document.getElementById('prompt-label'),
      footerWorld: document.getElementById('footer-world'),
      footerSeed: document.getElementById('footer-seed'),
      main: document.getElementById('terminal')
    };

    function applyPalette(palette) {
      if (!palette || palette.length < 3) return;
      const root = document.documentElement;
      root.style.setProperty('--bg', palette[0]);
      root.style.setProperty('--surface', palette[1]);
      root.style.setProperty('--accent', palette[2]);
      root.style.setProperty('--fg', palette[3] || '#ffffff');
      root.style.setProperty('--dim', palette[4] || palette[2]);
    }

    function renderWorld(world) {
      currentWorld = world;
      document.title = world.name + ' — LarpOS';
      applyPalette(world.palette);

      dom.name.textContent = world.name;
      dom.keeper.textContent = world.keeper.name;
      dom.theme.textContent = world.theme;
      dom.footerWorld.textContent = world.name;
      dom.footerSeed.textContent = 'SEED: ' + world.seed;

      dom.prompt.textContent = (world.keeper.prefix || 'SYSTEM') + ' ›';

      dom.scene.innerHTML = '';
      if (Array.isArray(world.script)) {
        world.script.forEach(line => {
          const el = document.createElement('div');
          el.className = 'scene-line';
          el.textContent = line;
          dom.scene.appendChild(el);
        });
      }

      dom.input.focus();
    }

    async function loadWorld() {
      try {
        const res = await fetch('/api/world');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        renderWorld(data);
      } catch (err) {
        dom.theme.textContent = 'Signal lost. Failed to load world telemetry.';
        console.error(err);
      }
    }

    function appendExchange(cmdText, responseText) {
      const entry = document.createElement('div');
      entry.className = 'log-entry';

      const cmdEl = document.createElement('div');
      cmdEl.className = 'log-command';
      cmdEl.textContent = cmdText;

      const respEl = document.createElement('div');
      respEl.className = 'log-response';
      respEl.textContent = responseText;

      entry.appendChild(cmdEl);
      entry.appendChild(respEl);
      dom.entries.appendChild(entry);

      dom.main.scrollTop = dom.main.scrollHeight;
    }

    async function submitCommand(text) {
      const cmd = text.trim();
      if (!cmd) return;

      history.push(cmd);
      historyIndex = history.length;
      dom.input.value = '';

      try {
        const res = await fetch('/api/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: cmd })
        });
        const data = await res.json();

        appendExchange(cmd, data.out || '(No response received)');

        if (data.reseeded && data.world) {
          renderWorld(data.world);
          dom.entries.innerHTML = '';
        } else if (data.reseeded) {
          loadWorld();
          dom.entries.innerHTML = '';
        }
      } catch (err) {
        appendExchange(cmd, 'TRANSMISSION FAILURE: ' + err.message);
      }
    }

    dom.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitCommand(dom.input.value);
      } else if (e.key === 'ArrowUp') {
        if (history.length > 0 && historyIndex > 0) {
          historyIndex--;
          dom.input.value = history[historyIndex] || '';
          e.preventDefault();
        }
      } else if (e.key === 'ArrowDown') {
        if (historyIndex < history.length - 1) {
          historyIndex++;
          dom.input.value = history[historyIndex] || '';
        } else {
          historyIndex = history.length;
          dom.input.value = '';
        }
        e.preventDefault();
      }
    });

    // Auto-focus on click anywhere
    document.addEventListener('click', (e) => {
      if (!window.getSelection().toString()) {
        dom.input.focus();
      }
    });

    loadWorld();
  </script>
</body>
</html>
